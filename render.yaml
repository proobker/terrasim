services:
  - type: web
    name: terrasim-api
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://terrasim.rabidahal.com.np,https://terrasim.onrender.com

  - type: web
    name: terrasim
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    # Vite content-hashes everything under /assets, so a changed file always
    # gets a new URL: cache those forever, keep index.html revalidating.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE
        value: https://terrasim-api.onrender.com