name: keep-warm

# Render's free web services sleep after 15 min without traffic, and waking
# one takes 30-60 s of 502/503s: the first visitor stares at the boot screen
# for a minute. A ping every 10 min keeps terrasim-api awake.
# GitHub may delay scheduled runs under load, so this is best-effort; an
# external uptime monitor on the same URL is the stricter alternative.
# One always-on free service uses ~730 of the workspace's 750 free
# instance-hours a month: disable this workflow if other free services
# share the workspace.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        # Retries ride out a wake-up already in progress.
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 30 https://terrasim-api.onrender.com/api/health
